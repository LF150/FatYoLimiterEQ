<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ManzKind Cloud Sandbox</title>
<style>html,body{margin:0;height:100%;background:#0e0e0e;color:#ddd;font:14px system-ui;overflow:hidden}#bar{height:48px;background:#191919;display:flex;align-items:center;gap:8px;padding:6px 10px;box-sizing:border-box}button,select{background:#252525;color:#eee;border:1px solid #484848;border-radius:5px;padding:7px 10px}#status{margin-left:auto;font:11px monospace}#stage{height:calc(100% - 48px);display:flex;align-items:center;justify-content:center;overflow:hidden}#plugin{width:1334px;height:750px;border:0;background:#000;transform-origin:center center}#panel{position:fixed;right:10px;top:58px;width:min(430px,calc(100vw - 20px));max-height:calc(100vh - 70px);overflow:auto;background:#151515;border:1px solid #444;border-radius:7px;padding:12px;display:none;z-index:2}.open{display:block!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;font:11px monospace}.card{border:1px solid #333;padding:7px;border-radius:5px}.wide{grid-column:1/-1}pre{white-space:pre-wrap;font:11px monospace}</style></head><body>
<div id="bar"><select id="plugins"></select><button id="reload">Reload</button><button id="diag">Diagnostics</button><span id="status">starting…</span></div>
<div id="stage"><iframe id="plugin" title="Plugin execution surface"></iframe></div>
<section id="panel"><div class="grid" id="device"></div><button id="bench">Run 1 / 2 / 4 / 8 worker test</button><pre id="benchout">No benchmark run.</pre></section>
<script>
const frame=document.getElementById('plugin'),stage=document.getElementById('stage'),sel=document.getElementById('plugins'),panel=document.getElementById('panel');
function fit(){frame.style.transform='scale('+Math.min(stage.clientWidth/1334,stage.clientHeight/750)+')'}addEventListener('resize',fit);
async function init(){const p=await(await fetch('/api/plugins',{cache:'no-store'})).json();sel.innerHTML=p.length?p.map(x=>'<option value="'+x.url+'">'+x.name+'</option>').join(''):'<option>No plugin installed</option>';if(p.length)frame.src=p[0].url;fit()}sel.onchange=()=>frame.src=sel.value;reload.onclick=()=>frame.contentWindow.location.reload();diag.onclick=()=>{panel.classList.toggle('open');profile()};
function profile(){const A=window.AudioContext||window.webkitAudioContext,r=[['viewport',innerWidth+' × '+innerHeight],['device pixels',screen.width+' × '+screen.height],['DPR',devicePixelRatio],['orientation',screen.orientation?.type||'unknown'],['cores',navigator.hardwareConcurrency||'unknown'],['memory hint GB',navigator.deviceMemory||'unknown'],['Web Audio',!!A],['secure context',isSecureContext]];if(A)try{let a=new A;r.push(['audio sample rate',a.sampleRate]);r.push(['audio state',a.state]);a.close()}catch{};device.innerHTML=r.map(x=>'<div class="card"><b>'+x[0]+'</b><br>'+String(x[1]).replaceAll('<','&lt;')+'</div>').join('')}
async function wr(n){let t=performance.now(),a=[];for(let w=0;w<n;w++)a.push(new Promise(ok=>{let s='onmessage=e=>{let x=e.data;for(let i=0;i<7000000;i++)x=Math.sin(x)+Math.cos(x);postMessage(x)}',q=new Worker(URL.createObjectURL(new Blob([s],{type:'text/javascript'})));q.onmessage=()=>{q.terminate();ok()};q.postMessage(w+1)}));await Promise.all(a);return(performance.now()-t)/1000}
bench.onclick=async()=>{benchout.textContent='Running…';let r={};for(let n of [1,2,4,8])r[n]=await wr(n);let b=r[1];benchout.textContent=Object.entries(r).map(([n,t])=>n+' worker(s): '+t.toFixed(3)+' s | speed-up '+(b/t).toFixed(2)+'x | efficiency '+(b/t/Number(n)*100).toFixed(0)+'%').join('\n');fetch('/api/results',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'worker-benchmark',ua:navigator.userAgent,results:r})}).catch(()=>{})};
setInterval(()=>{let m=performance.memory?.usedJSHeapSize;status.textContent='JS RAM '+(m?(m/1048576).toFixed(0)+' MB':'n/a')},1000);init();
</script></body></html>
